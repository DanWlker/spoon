force_quit = ["ctrl-c"]
quit = ["q"]
help_toggle = ["f1"]
cancel = ["esc"]
close = ["backspace"]

navigate_up = ["k", "up"]
navigate_down = ["j", "down"]
navigate_right = ["l", "right"]
navigate_left = ["h", "left"]
select_up = ["shift-k"]
select_down = ["shift-j"]

go_to_top = ["g"]
go_to_bottom = ["shift-g"]
scroll_down = ["ctrl-e"]
scroll_up = ["ctrl-y"]
page_up = ["ctrl-b", "pageup"]
page_down = ["ctrl-f", "pagedown"]
half_page_up = ["ctrl-u"]
half_page_down = ["ctrl-d"]

go_to_next = ["n"]
go_to_previous = ["shift-n"]
confirm = ["enter"]
# switch between the local changes page and the commit graph
ref_list = ["tab"]
search = ["/"]
# filter file trees
filter = ["?"]
search_target_toggle = ["ctrl-t"]
ignore_case_toggle = ["ctrl-g"]
fuzzy_toggle = ["ctrl-x"]
refresh = ["shift-r"]

# focus the refs sidebar on the left
focus_panel_0 = ["0"]
# switch between panels: unstaged/staged/commit in local changes; the commit list and the
# info/changes/files tabs of the commit details on the graph (opened right away);
# digits are used as a count prefix in views without panels
focus_panel_1 = ["1"]
focus_panel_2 = ["2"]
focus_panel_3 = ["3"]
focus_panel_4 = ["4"]

# stage/unstage the selected file, directory, hunk or line in local changes
toggle_stage = ["space"]
# select several items: commits in the commit list, files in local changes
toggle_select = ["v"]
# go to the next/previous picked commit or file; keys separated by a space are pressed one after another
next_picked = ["] v"]
previous_picked = ["[ v"]
# switch to the next/previous tab of the commit details (info, changes, files) while one has the focus;
# elsewhere these keys start the sequences above
next_tab = ["]"]
previous_tab = ["["]
# stash local changes, or only the selected files
stash = ["s"]
# commit (or amend), or continue the rebase in progress
commit = ["c"]
# abort the rebase, merge, cherry-pick or revert in progress, after confirming
abort = ["shift-c"]
# amend the last commit instead of making a new one
toggle_amend = ["shift-a"]
# open the selected file in $VISUAL or $EDITOR
edit = ["e"]
# discard the selected unstaged changes in local changes, after confirming
discard = ["d"]

# the commit graph; these keys may also be used on the local changes page, for something else there
# diff the selected commit with HEAD, or the two picked commits, in the details
diff = ["d"]
# rebase the current branch onto the selected commit, after confirming
rebase = ["r"]
# merge the selected branch into the current branch, after confirming
merge = ["m"]
# check out the selected branch or commit, after confirming
checkout = ["c"]
# cherry-pick the picked commits, or the selected one, after confirming
cherry_pick = ["shift-c"]
# squash the picked commits, or the selected one, into their parents, after confirming
squash = ["s"]
# revert the picked commits, or the selected one, after confirming
revert = ["u"]
# reset the current branch to the selected commit, after confirming
reset = ["shift-u"]
# amend the selected commit with the staged changes, after confirming
amend_commit = ["shift-a"]

# in the popups of the git commands: toggle the selected checkbox or go to the next option (dialog_toggle),
# type into the selected text field (dialog_edit), or either, toggling when the field can be toggled (dialog_activate)
dialog_toggle = ["v"]
dialog_edit = ["e"]
dialog_activate = ["space"]

# fetch from a remote, chosen in a popup
fetch = ["f"]
# fetch all remotes
fetch_all = ["shift-f"]
# pull a branch of a remote, chosen in a popup
pull = ["p"]
# push a branch to a remote, chosen in a popup
push = ["shift-p"]

# copy part of information, ex: copy the short commit hash not all
short_copy = ["y"]
full_copy = ["shift-y"]
