force_quit = ["ctrl-c"]
quit = ["q"]
# the keys list: the actions of the focused panel, to search (with /) and run (with enter), then
# those of the other panels
help_toggle = ["?"]
cancel = ["esc"]

navigate_up = ["k", "up"]
navigate_down = ["j", "down"]
navigate_right = ["l", "right"]
navigate_left = ["h", "left"]
select_up = ["shift-k", "shift-up"]
select_down = ["shift-j", "shift-down"]

go_to_top = ["g"]
go_to_bottom = ["shift-g"]
scroll_down = ["ctrl-e"]
scroll_up = ["ctrl-y"]
page_up = ["ctrl-b", "pageup"]
page_down = ["ctrl-f", "pagedown"]
half_page_up = ["ctrl-u"]
half_page_down = ["ctrl-d"]

go_to_next = ["n"]
go_to_previous = ["shift-n"]
confirm = ["enter"]
# switch between the local changes page and the commit graph
ref_list = ["tab"]
# search; in file trees, filter the files
search = ["/"]
search_target_toggle = ["ctrl-t"]
smart_case_toggle = ["ctrl-g"]
fuzzy_toggle = ["ctrl-x"]
refresh = ["ctrl-r"]
# move the focus to the panel beside, above or under the focused one
focus_left = ["ctrl-left", "ctrl-h"]
focus_right = ["ctrl-right", "ctrl-l"]
focus_up = ["ctrl-up", "ctrl-k"]
focus_down = ["ctrl-down", "ctrl-j"]
# move the border beside or above the focused panel, resizing it (borders can be dragged too)
resize_left = ["alt-left", "alt-h"]
resize_right = ["alt-right", "alt-l"]
resize_up = ["alt-up", "alt-k"]
resize_down = ["alt-down", "alt-j"]
# show the keys of the focused panel in a popup
keys_toggle = ["shift-h"]

# focus the panels of a page: the refs sidebar is [1] on the graph, the local changes page uses [1]-[3]
# for the unstaged/staged files and the commit message, and the commit details add [3]-[5] for the
# info/changes/files tabs (the commit list is [2])
focus_panel_1 = ["1"]
focus_panel_2 = ["2"]
focus_panel_3 = ["3"]
focus_panel_4 = ["4"]
focus_panel_5 = ["5"]

# the main action on what is selected, like lazygit's: stage/unstage the file, directory, hunk or
# line in local changes, apply the hunk or line of a commit's diff to the working tree, check out
# the commit or ref, apply the stash, keep a side of a conflict, toggle a field of a popup
select = ["space"]
# select a range of items: commits in the commit list, files in local changes, lines of a file
# preview or of a diff (inside one hunk); moving extends it, and again ends it, keeping them selected
toggle_select = ["v"]
# show more or fewer lines around the changes of a diff of one file
increase_diff_context = ["+"]
decrease_diff_context = ["-"]
# switch to the next/previous tab of the commit details (info, changes, files) while one has the focus
next_tab = ["]"]
previous_tab = ["["]
# reset the selected file of the changes tab to how it was at the commit or before it, after confirming
reset_file = ["u"]
# stash local changes, or only the selected files
stash = ["s"]
# commit (or amend)
commit = ["c"]
# the rebase, merge, cherry-pick or revert in progress: continue the rebase, abort it or skip the
# commit it stopped at (not a merge), after confirming
continue = ["m c"]
abort = ["m a"]
skip = ["m s"]
# amend the last commit instead of making a new one
toggle_amend = ["shift-a"]
# open the selected files in $VISUAL or $EDITOR: in local changes, the changes and files tabs of the commit details, the blame and the timeline
edit = ["e"]
# discard the selected unstaged changes in local changes, after confirming
discard = ["d"]
# go to the next/previous file in local changes, from the files or the diff, staying in the diff
next_file = ["] f"]
previous_file = ["[ f"]
# go to the next/previous folder at the same depth (or a level up when there is none) in local changes;
# from the diff, show the first file of it
next_folder = ["] shift-f"]
previous_folder = ["[ shift-f"]

# the commit graph; these keys may also be used on the local changes page, for something else there
# diff the selected commit with HEAD, or the two picked commits, in the details
diff = ["shift-d"]
# rebase the current branch onto the selected commit, after confirming
rebase = ["r"]
# merge the selected branch into the current branch, after confirming
merge = ["m"]
# check out the selected branch or commit, after confirming: space does it, see select
# cherry-pick the picked commits, or the selected one, after confirming
cherry_pick = ["shift-c"]
# squash the picked commits, or the selected one, into their parents, after confirming
squash = ["s"]
# revert the picked commits, or the selected one, after confirming
revert = ["u"]
# reset the current branch to the selected commit, after confirming
reset = ["shift-u"]
# amend the selected commit on the local changes page (an older one after confirming the rebase stopping at it)
amend_commit = ["shift-a"]
# drop the picked commits, or the selected one, after confirming
drop_commit = ["d"]
# create a branch at the selected commit; in the refs sidebar from the selected ref
create_branch = ["b"]
# create a tag at the selected commit; in the refs sidebar at the selected ref
create_tag = ["t"]
# show only the commits of the current branch (the history of HEAD), or all of them again
branch_only = ["shift-l"]
# open the page of the selected commit, branch (or a new pull request), remote branch, tag or file on
# the web host of its remote
open_in_browser = ["o"]

# the refs sidebar: create a remote (on a remote or the remotes header), delete the selected branch
# or tag or drop the selected stash, rename a branch or change its upstream
create_ref = ["a"]
delete_ref = ["d"]
edit_ref = ["e"]
# go to the next/previous section of the refs sidebar (branches, remotes, tags, stashes), opening it
next_section = ["]"]
previous_section = ["["]

# in the popups of the git commands: type into the selected text field (select toggles the field
# when it can be, else types too)
dialog_edit = ["e"]

# fetch from a remote, chosen in a popup
fetch = ["f"]
# fetch all remotes
fetch_all = ["shift-f"]
# pull a branch of a remote, chosen in a popup
pull = ["p"]
# push a branch to a remote, chosen in a popup
push = ["shift-p"]

# copy: y then y the short form (a short hash, a relative path, a name), f the full one, l the link of
# the page on the web host of its remote; in a diff or the lines of a file, y copies the selected
# lines at once (see the tables at the end)
short_copy = ["y y"]
full_copy = ["y f"]
copy_link = ["y l"]
# show the git commands the app ran that changed the repository, with their output
command_log = ["@"]
# add the selected file or directory to the .gitignore at the top of the repository
ignore = ["i"]
# hide the errors and warnings shown at the top right (they also go after 10 and 5 seconds)
dismiss_notifications = [","]
# wrap the long lines of the diffs and file previews, or not
toggle_wrap = ["w"]
# show who last changed each line of the selected file, in a window over everything
blame = ["shift-b"]
# show the commits changing the selected file, with its changes in each, in a window over everything
timeline = ["shift-t"]
# in these windows, the older/newer commit changing the file
older_commit = ["["]
newer_commit = ["]"]

# keys of a part of the app overriding the outer ones: in the diffs and the lines of the blame, y
# copies the selected lines at once, and Y copies their link
[details_pane]
short_copy = ["y"]
copy_link = ["shift-y"]

[local_changes_diff]
short_copy = ["y"]
copy_link = ["shift-y"]

[file_history_pane]
short_copy = ["y"]
copy_link = ["shift-y"]
