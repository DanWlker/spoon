force_quit = ["ctrl-c"]
quit = ["q"]
help_toggle = ["?","f1"]
cancel = ["esc"]
close = ["backspace"]

navigate_up = ["k", "up"]
navigate_down = ["j", "down"]
navigate_right = ["l", "right"]
navigate_left = ["h", "left"]
go_to_parent = ["alt-j", "alt-down"]
select_up = ["shift-k"]
select_down = ["shift-j"]

go_to_top = ["g"]
go_to_bottom = ["shift-g"]
scroll_down = ["ctrl-e"]
scroll_up = ["ctrl-y"]
page_up = ["ctrl-b", "pageup"]
page_down = ["ctrl-f", "pagedown"]
half_page_up = ["ctrl-u"]
half_page_down = ["ctrl-d"]
select_top = ["shift-h"]
select_middle = ["shift-m"]
select_bottom = ["shift-l"]

go_to_next = ["n"]
go_to_previous = ["shift-n"]
confirm = ["enter"]
ref_list = ["tab"]
search = ["/"]
search_target_toggle = ["ctrl-t"]
ignore_case_toggle = ["ctrl-g"]
fuzzy_toggle = ["ctrl-x"]
mark_toggle = ["m"]
refresh = ["shift-r"]

user_command_1 = ["shift-d"]

# switch between panels, ex: unstaged/staged in local changes
# digits are used as a count prefix in views without panels
focus_panel_1 = ["1"]
focus_panel_2 = ["2"]
focus_panel_3 = ["3"]

# stage/unstage the selected file, directory, hunk or line in local changes,
# pick/unpick the selected commit in the commit list
toggle_select = ["space"]
# discard the selected unstaged changes in local changes, after confirming
discard = ["d"]

# copy part of information, ex: copy the short commit hash not all
short_copy = ["c"]
full_copy = ["shift-c"]
