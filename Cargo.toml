[package]
name = "spoon"
version = "0.9.0"
description = "A lazygit-style git TUI with a rich commit graph, forked from serie"
authors = ["Kyosuke Fujimoto <kyoro.f@gmail.com>", "DanWlker <danielhee2@gmail.com>"]
homepage = "https://github.com/DanWlker/spoon"
repository = "https://github.com/DanWlker/spoon"
readme = "README.md"
license = "MIT"
keywords = ["cli", "git", "terminal", "tui"]
categories = ["command-line-utilities"]
edition = "2021"
rust-version = "1.99.1"

exclude = ["/.github", "/img"]

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
crokey = { version = "1.5", default-features = false }
fuzzy-matcher = "0.3.7"
garde = { version = "0.23.0", features = ["derive", "regex"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
open = "5.4.4"
percent-encoding = "2.3.2"
ratatui = { version = "0.30.2", features = ["serde"] }
ratatui-textarea = "0.9.3"
rustc-hash = "2.1.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
smart-default = "0.7.1"
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
toml = "1.1.8"
tui-input = "0.15.5"
umbra = "0.5.0"
unicode-width = "0.2.2"

[dev-dependencies]
font8x8 = "0.3.1"
rstest = "0.27.0"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
