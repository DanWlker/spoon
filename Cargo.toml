[package]
name = "spoon"
version = "0.43.0"
description = "A lazygit-style git TUI with a rich commit graph, forked from serie"
authors = ["Kyosuke Fujimoto <kyoro.f@gmail.com>", "DanWlker <danielhee2@gmail.com>"]
repository = "https://github.com/DanWlker/spoon"
readme = "README.md"
license = "MIT"
keywords = ["cli", "git", "terminal", "tui"]
categories = ["command-line-utilities"]
edition = "2021"
rust-version = "1.99.1"

exclude = ["/.github", "/img"]

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6.8", features = ["derive"] }
console = "0.16.6"
crokey = { version = "1.5", default-features = false }
elsa = "1.11.2"
fuzzy-matcher = "0.3.7"
garde = { version = "0.23.0", features = ["derive", "regex"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
jiff = "1.0.1"
open = "5.4.4"
percent-encoding = "2.3.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "serde"] }
ratatui-textarea = "0.9.3"
rustc-hash = "2.1.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
smart-default = "0.7.1"
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse", "display"] }
tui-input = { version = "0.15.5", default-features = false, features = ["crossterm"] }
umbra = "0.6.0"
unicode-width = "0.2.2"

[dev-dependencies]
font8x8 = "0.3.1"
rstest = { version = "0.28.0", default-features = false }
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
